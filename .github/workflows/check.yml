name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake-check:
    name: Eval + VM lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Eval checks (projects and databases)
        run: nix build .#checks.x86_64-linux.eval .#checks.x86_64-linux.database-eval --no-link -L

      - name: VM lifecycle check (requires KVM)
        run: |
          if [ -e /dev/kvm ]; then
            nix build .#checks.x86_64-linux.lifecycle .#checks.x86_64-linux.database --no-link -L
          else
            echo "::warning::/dev/kvm not available on this runner — VM lifecycle check skipped"
          fi

      - name: Options doc renders
        run: nix build .#options-doc --no-link
